# Backend-only dependencies for local `mvn spring-boot:run`.
# Prefer the repository-root docker-compose.yml to run the full stack.

services:
  postgres:
    image: postgres:15
    container_name: stokmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stokmate}
      POSTGRES_USER: ${DB_USERNAME:-stokmate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme-db-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: stokmate-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
