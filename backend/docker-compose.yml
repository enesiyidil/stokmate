version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: stokmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stokmate}
      POSTGRES_USER: ${DB_USERNAME:-stokmate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stokmate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: stokmate-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    container_name: stokmate-app
    depends_on:
      - postgres
      - minio
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-stokmate}
      DB_USERNAME: ${DB_USERNAME:-stokmate}
      DB_PASSWORD: ${DB_PASSWORD:-stokmate}
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me-please}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stokmate.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-invoices}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
