server.port=9090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stokmate}
spring.datasource.username=${DB_USERNAME:stokmate}
spring.datasource.password=${DB_PASSWORD:stokmate}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false

app.security.jwt.secret=${JWT_SECRET:changeme-please-change-secret-key-should-be-long}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:invoices}

app.admin.email=${ADMIN_EMAIL:admin@stokmate.local}
app.admin.password=${ADMIN_PASSWORD:admin123}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# SMTP Configuration (optional — leave username/password empty to disable outbound mail)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
